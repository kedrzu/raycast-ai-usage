name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Unit tests first: they need no network, so a genuine regression is
      # reported even when raycast.com is unreachable.
      - name: Test
        run: npm test

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      # `ray lint` validates package.json against the Raycast API, so it is the
      # one step that can fail for reasons unrelated to the commit.
      - name: Lint
        run: npm run lint
